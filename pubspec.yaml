name: my_money
description: "My Money - Application de gestion d'argent personnelle, 100% offline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

  # State management
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8

  # Navigation
  go_router: ^18.1.4

  # Database
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0

  # Charts
  fl_chart: ^1.3.1

  # Security
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  encrypt: ^5.0.3
  crypto: ^3.0.8

  # Notifications
  flutter_local_notifications: ^23.0.3

  # File & sharing
  share_plus: ^13.3.1
  file_picker: ^13.4.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6

  # Export
  csv: ^8.0.0
  pdf: ^3.13.1

  # Utils
  intl: ^0.20.3
  uuid: ^4.0.0
  path: ^1.9.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.4.0
  riverpod_generator: ^4.0.10
  riverpod_lint: ^3.2.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
